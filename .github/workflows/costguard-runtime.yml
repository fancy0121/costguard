name: costguard-runtime

on:
  push:
    paths:
      - "costguard-runtime/**"
      - ".github/workflows/costguard-runtime.yml"
  pull_request:
    paths:
      - "costguard-runtime/**"
      - ".github/workflows/costguard-runtime.yml"

jobs:
  local-contracts:
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: costguard-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run privacy:scan
      - run: bun run package:check
